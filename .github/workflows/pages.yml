name: Validate and deploy GitHub Pages

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate, test, and build
        run: npm run build

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Smoke-test deployed HTML and public data
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          base_url="${PAGE_URL%/}"
          html_type="$(curl --fail --location --silent --show-error --retry 6 --retry-all-errors --output /tmp/landom-index.html --write-out '%{content_type}' "$base_url/")"
          english_type="$(curl --fail --location --silent --show-error --retry 6 --retry-all-errors --output /tmp/landom-en.html --write-out '%{content_type}' "$base_url/en/")"
          data_type="$(curl --fail --location --silent --show-error --retry 6 --retry-all-errors --output /tmp/landom-site-data.json --write-out '%{content_type}' "$base_url/data/generated/site-data.json")"
          manifest_type="$(curl --fail --location --silent --show-error --retry 6 --retry-all-errors --output /tmp/landom-build-manifest.json --write-out '%{content_type}' "$base_url/build-manifest.json")"
          script_type="$(curl --fail --location --silent --show-error --retry 6 --retry-all-errors --output /tmp/landom-app.js --write-out '%{content_type}' "$base_url/src/app.js")"
          style_type="$(curl --fail --location --silent --show-error --retry 6 --retry-all-errors --output /tmp/landom-styles.css --write-out '%{content_type}' "$base_url/src/styles.css")"
          logo_type="$(curl --fail --location --silent --show-error --retry 6 --retry-all-errors --output /tmp/landom-logo.png --write-out '%{content_type}' "$base_url/public/assets/brand/landometer-horizontal.png")"
          font_manifest_type="$(curl --fail --location --silent --show-error --retry 6 --retry-all-errors --output /tmp/landom-font-manifest.json --write-out '%{content_type}' "$base_url/public/assets/fonts/font-assets.manifest.json")"
          font_type="$(curl --fail --location --silent --show-error --retry 6 --retry-all-errors --output /tmp/landom-body-thai.woff2 --write-out '%{content_type}' "$base_url/public/assets/fonts/bai-jamjuree-thai-400-normal.woff2")"
          icon_font_type="$(curl --fail --location --silent --show-error --retry 6 --retry-all-errors --output /tmp/landom-material-symbols.woff2 --write-out '%{content_type}' "$base_url/public/assets/fonts/material-symbols-rounded-open-in-new-300.woff2")"
          portrait_type="$(curl --fail --location --silent --show-error --retry 6 --retry-all-errors --output /tmp/landom-portrait-s0001.jpg --write-out '%{content_type}' "$base_url/public/assets/people/S0001.jpg")"
          social_preview_type="$(curl --fail --location --silent --show-error --retry 6 --retry-all-errors --output /tmp/landom-people-og.jpg --write-out '%{content_type}' "$base_url/public/assets/social/landom-people-og.jpg?v=8f60ab324aaa")"
          robots_type="$(curl --fail --location --silent --show-error --retry 6 --retry-all-errors --output /tmp/landom-robots.txt --write-out '%{content_type}' "$base_url/robots.txt")"
          sitemap_type="$(curl --fail --location --silent --show-error --retry 6 --retry-all-errors --output /tmp/landom-sitemap.xml --write-out '%{content_type}' "$base_url/sitemap.xml")"
          llms_type="$(curl --fail --location --silent --show-error --retry 6 --retry-all-errors --output /tmp/landom-llms.txt --write-out '%{content_type}' "$base_url/llms.txt")"
          favicon_type="$(curl --fail --location --silent --show-error --retry 6 --retry-all-errors --output /tmp/landom-favicon.png --write-out '%{content_type}' 'https://montri-th.github.io/Landometer/assets/images/landometer-symbol-transparent.png?v=35a1496f')"
          case "$html_type" in text/html*) ;; *) echo "Unexpected HTML content type: $html_type"; exit 1;; esac
          case "$english_type" in text/html*) ;; *) echo "Unexpected English HTML content type: $english_type"; exit 1;; esac
          case "$data_type" in application/json*|text/json*) ;; *) echo "Unexpected JSON content type: $data_type"; exit 1;; esac
          case "$manifest_type" in application/json*|text/json*) ;; *) echo "Unexpected manifest content type: $manifest_type"; exit 1;; esac
          case "$script_type" in application/javascript*|text/javascript*) ;; *) echo "Unexpected JavaScript content type: $script_type"; exit 1;; esac
          case "$style_type" in text/css*) ;; *) echo "Unexpected CSS content type: $style_type"; exit 1;; esac
          case "$logo_type" in image/png*) ;; *) echo "Unexpected logo content type: $logo_type"; exit 1;; esac
          case "$font_manifest_type" in application/json*|text/json*) ;; *) echo "Unexpected font manifest content type: $font_manifest_type"; exit 1;; esac
          case "$font_type" in font/woff2*|application/font-woff*|application/octet-stream*) ;; *) echo "Unexpected WOFF2 content type: $font_type"; exit 1;; esac
          case "$icon_font_type" in font/woff2*|application/font-woff*|application/octet-stream*) ;; *) echo "Unexpected icon WOFF2 content type: $icon_font_type"; exit 1;; esac
          case "$portrait_type" in image/jpeg*) ;; *) echo "Unexpected portrait content type: $portrait_type"; exit 1;; esac
          case "$social_preview_type" in image/jpeg*) ;; *) echo "Unexpected social preview content type: $social_preview_type"; exit 1;; esac
          case "$robots_type" in text/plain*) ;; *) echo "Unexpected robots content type: $robots_type"; exit 1;; esac
          case "$sitemap_type" in application/xml*|text/xml*) ;; *) echo "Unexpected sitemap content type: $sitemap_type"; exit 1;; esac
          case "$llms_type" in text/plain*) ;; *) echo "Unexpected llms.txt content type: $llms_type"; exit 1;; esac
          case "$favicon_type" in image/png*) ;; *) echo "Unexpected favicon content type: $favicon_type"; exit 1;; esac
          node --input-type=module -e '
            import { createHash } from "node:crypto";
            import { readFileSync } from "node:fs";
            const html = readFileSync("/tmp/landom-index.html", "utf8");
            const english = readFileSync("/tmp/landom-en.html", "utf8");
            const data = JSON.parse(readFileSync("/tmp/landom-site-data.json", "utf8"));
            const manifest = JSON.parse(readFileSync("/tmp/landom-build-manifest.json", "utf8"));
            if (!html.includes("id=\"people-board\"")) throw Error("people board missing from deployed HTML");
            if (!html.includes("data-locale-route=\"th\"") || !html.includes("hreflang=\"th\" href=\"https://montri-th.github.io/Landom/\"")) throw Error("Thai canonical root metadata is missing");
            if (!english.includes("data-locale-route=\"en\"") || !english.includes("id=\"page-title\">It’s not a place.&#10;It’s the people.</h1>")) throw Error("English localized route metadata/copy is missing");
            if (!html.includes("property=\"og:image\" content=\"https://montri-th.github.io/Landom/public/assets/social/landom-people-og.jpg?v=8f60ab324aaa\"") || !english.includes("content=\"People of Landom during a shared activity at Landometer\"")) throw Error("Localized social preview metadata is missing");
            if (!english.includes("href=\"https://montri-th.github.io/Landom/en/#main-content\"")) throw Error("English skip link leaves the localized route");
            if (!Array.isArray(data.people) || data.people.length === 0) throw Error("deployed people dataset is empty");
            const expected = new Map(manifest.files.map((record) => [record.path, record.sha256]));
            const critical = [
              ["index.html", "/tmp/landom-index.html"],
              ["en/index.html", "/tmp/landom-en.html"],
              ["data/generated/site-data.json", "/tmp/landom-site-data.json"],
              ["src/app.js", "/tmp/landom-app.js"],
              ["src/styles.css", "/tmp/landom-styles.css"],
              ["public/assets/brand/landometer-horizontal.png", "/tmp/landom-logo.png"],
              ["public/assets/fonts/font-assets.manifest.json", "/tmp/landom-font-manifest.json"],
              ["public/assets/fonts/bai-jamjuree-thai-400-normal.woff2", "/tmp/landom-body-thai.woff2"],
              ["public/assets/fonts/material-symbols-rounded-open-in-new-300.woff2", "/tmp/landom-material-symbols.woff2"],
              ["public/assets/people/S0001.jpg", "/tmp/landom-portrait-s0001.jpg"],
              ["public/assets/social/landom-people-og.jpg", "/tmp/landom-people-og.jpg"],
              ["robots.txt", "/tmp/landom-robots.txt"],
              ["sitemap.xml", "/tmp/landom-sitemap.xml"],
              ["llms.txt", "/tmp/landom-llms.txt"]
            ];
            for (const [publishedPath, localPath] of critical) {
              const digest = createHash("sha256").update(readFileSync(localPath)).digest("hex");
              if (!expected.has(publishedPath) || expected.get(publishedPath) !== digest) {
                throw Error(`live bytes do not match build manifest for ${publishedPath}`);
              }
            }
            const favicon = readFileSync("/tmp/landom-favicon.png");
            const faviconDigest = createHash("sha256").update(favicon).digest("hex");
            if (favicon.length !== 11001 || faviconDigest !== "35a1496f6e8c502cef82f0a46de5dacff98718ff9f5a6c07ccc3783d76e3ae85") {
              throw Error("deployed favicon bytes do not match the exact DS approval record");
            }
            const socialPreview = readFileSync("/tmp/landom-people-og.jpg");
            const socialPreviewDigest = createHash("sha256").update(socialPreview).digest("hex");
            if (socialPreview.length !== 176692 || socialPreviewDigest !== "8f60ab324aaa9e8984a4e13335e3b9db201c67e243f0cc59ba0da177f8adbed0") {
              throw Error("deployed social preview bytes do not match the owner-approved identity record");
            }
          '
