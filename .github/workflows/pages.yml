name: Validate and deploy GitHub Pages

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      manifest_sha256: ${{ steps.build_manifest.outputs.sha256 }}
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate, test, and build
        run: npm run build

      - name: Record expected build manifest
        id: build_manifest
        run: echo "sha256=$(sha256sum dist/build-manifest.json | cut -d ' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Smoke-test deployed HTML and public data
        env:
          EXPECTED_MANIFEST_SHA256: ${{ needs.build.outputs.manifest_sha256 }}
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          base_url="${PAGE_URL%/}"
          cache_bust="release=$RELEASE_SHA"
          for attempt in {1..12}; do
            manifest_type="$(curl --fail --location --silent --show-error --retry 6 --retry-all-errors --output /tmp/landom-build-manifest.json --write-out '%{content_type}' "$base_url/build-manifest.json?$cache_bust")"
            actual_manifest_sha256="$(sha256sum /tmp/landom-build-manifest.json | cut -d ' ' -f1)"
            if [ "$actual_manifest_sha256" = "$EXPECTED_MANIFEST_SHA256" ]; then
              break
            fi
            if [ "$attempt" -eq 12 ]; then
              echo "Live build manifest does not match this workflow run: expected $EXPECTED_MANIFEST_SHA256, got $actual_manifest_sha256"
              exit 1
            fi
            sleep 5
          done
          html_type="$(curl --fail --location --silent --show-error --retry 6 --retry-all-errors --output /tmp/landom-index.html --write-out '%{content_type}' "$base_url/?$cache_bust")"
          english_type="$(curl --fail --location --silent --show-error --retry 6 --retry-all-errors --output /tmp/landom-en.html --write-out '%{content_type}' "$base_url/en/?$cache_bust")"
          data_type="$(curl --fail --location --silent --show-error --retry 6 --retry-all-errors --output /tmp/landom-site-data.json --write-out '%{content_type}' "$base_url/data/generated/site-data.json?$cache_bust")"
          script_type="$(curl --fail --location --silent --show-error --retry 6 --retry-all-errors --output /tmp/landom-app.js --write-out '%{content_type}' "$base_url/src/app.js?$cache_bust")"
          navigation_script_type="$(curl --fail --location --silent --show-error --retry 6 --retry-all-errors --output /tmp/landom-navigation.js --write-out '%{content_type}' "$base_url/src/navigation.js?$cache_bust")"
          approach_motion_script_type="$(curl --fail --location --silent --show-error --retry 6 --retry-all-errors --output /tmp/landom-approach-motion.js --write-out '%{content_type}' "$base_url/src/approach-motion.js?$cache_bust")"
          brand_motion_script_type="$(curl --fail --location --silent --show-error --retry 6 --retry-all-errors --output /tmp/landom-brand-motion.js --write-out '%{content_type}' "$base_url/src/brand-motion.js?$cache_bust")"
          media_parallax_script_type="$(curl --fail --location --silent --show-error --retry 6 --retry-all-errors --output /tmp/landom-media-parallax.js --write-out '%{content_type}' "$base_url/src/media-parallax.js?$cache_bust")"
          style_type="$(curl --fail --location --silent --show-error --retry 6 --retry-all-errors --output /tmp/landom-styles.css --write-out '%{content_type}' "$base_url/src/styles.css?$cache_bust")"
          ds_color_type="$(curl --fail --location --silent --show-error --retry 6 --retry-all-errors --output /tmp/landom-color-srgb.css --write-out '%{content_type}' "$base_url/public/assets/design-system/color-srgb-05.production.css?$cache_bust")"
          motif_css_type="$(curl --fail --location --silent --show-error --retry 6 --retry-all-errors --output /tmp/landom-motifs.css --write-out '%{content_type}' "$base_url/public/assets/landometer/landometer-motifs.css?$cache_bust")"
          motif_js_type="$(curl --fail --location --silent --show-error --retry 6 --retry-all-errors --output /tmp/landom-motifs.js --write-out '%{content_type}' "$base_url/public/assets/landometer/landometer-motifs.js?$cache_bust")"
          logo_fallback_type="$(curl --fail --location --silent --show-error --retry 6 --retry-all-errors --output /tmp/landom-logo-quiet.svg --write-out '%{content_type}' "$base_url/public/assets/landometer/svg/logo-quiet.svg?$cache_bust")"
          dial_fallback_type="$(curl --fail --location --silent --show-error --retry 6 --retry-all-errors --output /tmp/landom-dial-quiet.svg --write-out '%{content_type}' "$base_url/public/assets/landometer/svg/dial-quiet.svg?$cache_bust")"
          rings_fallback_type="$(curl --fail --location --silent --show-error --retry 6 --retry-all-errors --output /tmp/landom-rings-quiet.svg --write-out '%{content_type}' "$base_url/public/assets/landometer/svg/rings-quiet.svg?$cache_bust")"
          layers_fallback_type="$(curl --fail --location --silent --show-error --retry 6 --retry-all-errors --output /tmp/landom-layers-quiet.svg --write-out '%{content_type}' "$base_url/public/assets/landometer/svg/layers-quiet.svg?$cache_bust")"
          slice_fallback_type="$(curl --fail --location --silent --show-error --retry 6 --retry-all-errors --output /tmp/landom-slice-quiet.svg --write-out '%{content_type}' "$base_url/public/assets/landometer/svg/slice-quiet.svg?$cache_bust")"
          cultivate_fallback_type="$(curl --fail --location --silent --show-error --retry 6 --retry-all-errors --output /tmp/landom-cultivate-quiet.svg --write-out '%{content_type}' "$base_url/public/assets/landometer/svg/cultivate-quiet.svg?$cache_bust")"
          logo_type="$(curl --fail --location --silent --show-error --retry 6 --retry-all-errors --output /tmp/landom-logo.png --write-out '%{content_type}' "$base_url/public/assets/brand/landometer-horizontal.png?$cache_bust")"
          font_manifest_type="$(curl --fail --location --silent --show-error --retry 6 --retry-all-errors --output /tmp/landom-font-manifest.json --write-out '%{content_type}' "$base_url/public/assets/fonts/font-assets.manifest.json?$cache_bust")"
          font_type="$(curl --fail --location --silent --show-error --retry 6 --retry-all-errors --output /tmp/landom-body-thai.woff2 --write-out '%{content_type}' "$base_url/public/assets/fonts/bai-jamjuree-thai-400-normal.woff2?$cache_bust")"
          icon_font_type="$(curl --fail --location --silent --show-error --retry 6 --retry-all-errors --output /tmp/landom-material-symbols.woff2 --write-out '%{content_type}' "$base_url/public/assets/fonts/material-symbols-rounded-open-in-new-300.woff2?$cache_bust")"
          nav_icon_font_type="$(curl --fail --location --silent --show-error --retry 6 --retry-all-errors --output /tmp/landom-material-symbols-nav.woff2 --write-out '%{content_type}' "$base_url/public/assets/fonts/material-symbols-rounded-nav-300.woff2?$cache_bust")"
          footer_icon_font_type="$(curl --fail --location --silent --show-error --retry 6 --retry-all-errors --output /tmp/landom-material-symbols-footer-r10.ttf --write-out '%{content_type}' "$base_url/public/assets/fonts/material-symbols-rounded-footer-r10.ttf?$cache_bust")"
          portrait_type="$(curl --fail --location --silent --show-error --retry 6 --retry-all-errors --output /tmp/landom-portrait-s0001.jpg --write-out '%{content_type}' "$base_url/public/assets/people/S0001.jpg?$cache_bust")"
          ham_portrait_type="$(curl --fail --location --silent --show-error --retry 6 --retry-all-errors --output /tmp/landom-portrait-i0009.jpg --write-out '%{content_type}' "$base_url/public/assets/people/I0009.jpg?$cache_bust")"
          social_preview_type="$(curl --fail --location --silent --show-error --retry 6 --retry-all-errors --output /tmp/landom-people-og.jpg --write-out '%{content_type}' "$base_url/public/assets/social/landom-people-og.jpg?v=a7c46cf31e97&$cache_bust")"
          hero_image_type="$(curl --fail --location --silent --show-error --retry 6 --retry-all-errors --output /tmp/landom-people-hero.jpg --write-out '%{content_type}' "$base_url/public/assets/hero/landom-people-hero.jpg?$cache_bust")"
          hero_anchor_type="$(curl --fail --location --silent --show-error --retry 6 --retry-all-errors --output /tmp/landom-community-anchor.jpg --write-out '%{content_type}' "$base_url/public/assets/hero/landom-community-anchor.jpg?$cache_bust")"
          hero_dinner_type="$(curl --fail --location --silent --show-error --retry 6 --retry-all-errors --output /tmp/landom-community-dinner.jpg --write-out '%{content_type}' "$base_url/public/assets/hero/landom-community-dinner.jpg?$cache_bust")"
          hero_gathering_type="$(curl --fail --location --silent --show-error --retry 6 --retry-all-errors --output /tmp/landom-community-gathering.jpg --write-out '%{content_type}' "$base_url/public/assets/hero/landom-community-gathering.jpg?$cache_bust")"
          hero_citymeter_type="$(curl --fail --location --silent --show-error --retry 6 --retry-all-errors --output /tmp/landom-community-citymeter.jpg --write-out '%{content_type}' "$base_url/public/assets/hero/landom-community-citymeter.jpg?$cache_bust")"
          hero_motif_type="$(curl --fail --location --silent --show-error --retry 6 --retry-all-errors --output /tmp/landometer-hero-motif.png --write-out '%{content_type}' "$base_url/public/assets/decor/landometer-hero-motif.png?$cache_bust")"
          robots_type="$(curl --fail --location --silent --show-error --retry 6 --retry-all-errors --output /tmp/landom-robots.txt --write-out '%{content_type}' "$base_url/robots.txt?$cache_bust")"
          sitemap_type="$(curl --fail --location --silent --show-error --retry 6 --retry-all-errors --output /tmp/landom-sitemap.xml --write-out '%{content_type}' "$base_url/sitemap.xml?$cache_bust")"
          llms_type="$(curl --fail --location --silent --show-error --retry 6 --retry-all-errors --output /tmp/landom-llms.txt --write-out '%{content_type}' "$base_url/llms.txt?$cache_bust")"
          favicon_type="$(curl --fail --location --silent --show-error --retry 6 --retry-all-errors --output /tmp/landom-favicon.png --write-out '%{content_type}' "https://montri-th.github.io/Landometer/assets/images/landometer-symbol-transparent.png?v=35a1496f&$cache_bust")"
          case "$html_type" in text/html*) ;; *) echo "Unexpected HTML content type: $html_type"; exit 1;; esac
          case "$english_type" in text/html*) ;; *) echo "Unexpected English HTML content type: $english_type"; exit 1;; esac
          case "$data_type" in application/json*|text/json*) ;; *) echo "Unexpected JSON content type: $data_type"; exit 1;; esac
          case "$manifest_type" in application/json*|text/json*) ;; *) echo "Unexpected manifest content type: $manifest_type"; exit 1;; esac
          case "$script_type" in application/javascript*|text/javascript*) ;; *) echo "Unexpected JavaScript content type: $script_type"; exit 1;; esac
          case "$navigation_script_type" in application/javascript*|text/javascript*) ;; *) echo "Unexpected navigation JavaScript content type: $navigation_script_type"; exit 1;; esac
          case "$approach_motion_script_type" in application/javascript*|text/javascript*) ;; *) echo "Unexpected approach-motion JavaScript content type: $approach_motion_script_type"; exit 1;; esac
          case "$brand_motion_script_type" in application/javascript*|text/javascript*) ;; *) echo "Unexpected brand-motion JavaScript content type: $brand_motion_script_type"; exit 1;; esac
          case "$media_parallax_script_type" in application/javascript*|text/javascript*) ;; *) echo "Unexpected media-parallax JavaScript content type: $media_parallax_script_type"; exit 1;; esac
          case "$style_type" in text/css*) ;; *) echo "Unexpected CSS content type: $style_type"; exit 1;; esac
          case "$ds_color_type" in text/css*) ;; *) echo "Unexpected DS color CSS content type: $ds_color_type"; exit 1;; esac
          case "$motif_css_type" in text/css*) ;; *) echo "Unexpected motif CSS content type: $motif_css_type"; exit 1;; esac
          case "$motif_js_type" in application/javascript*|text/javascript*) ;; *) echo "Unexpected motif JavaScript content type: $motif_js_type"; exit 1;; esac
          for svg_type in "$logo_fallback_type" "$dial_fallback_type" "$rings_fallback_type" "$layers_fallback_type" "$slice_fallback_type" "$cultivate_fallback_type"; do
            case "$svg_type" in image/svg+xml*) ;; *) echo "Unexpected motif fallback SVG content type: $svg_type"; exit 1;; esac
          done
          case "$logo_type" in image/png*) ;; *) echo "Unexpected logo content type: $logo_type"; exit 1;; esac
          case "$font_manifest_type" in application/json*|text/json*) ;; *) echo "Unexpected font manifest content type: $font_manifest_type"; exit 1;; esac
          case "$font_type" in font/woff2*|application/font-woff*|application/octet-stream*) ;; *) echo "Unexpected WOFF2 content type: $font_type"; exit 1;; esac
          case "$icon_font_type" in font/woff2*|application/font-woff*|application/octet-stream*) ;; *) echo "Unexpected icon WOFF2 content type: $icon_font_type"; exit 1;; esac
          case "$nav_icon_font_type" in font/woff2*|application/font-woff*|application/octet-stream*) ;; *) echo "Unexpected navigation icon WOFF2 content type: $nav_icon_font_type"; exit 1;; esac
          case "$footer_icon_font_type" in font/ttf*|application/x-font-ttf*|application/octet-stream*) ;; *) echo "Unexpected footer icon TTF content type: $footer_icon_font_type"; exit 1;; esac
          case "$portrait_type" in image/jpeg*) ;; *) echo "Unexpected portrait content type: $portrait_type"; exit 1;; esac
          case "$ham_portrait_type" in image/jpeg*) ;; *) echo "Unexpected Ham portrait content type: $ham_portrait_type"; exit 1;; esac
          case "$social_preview_type" in image/jpeg*) ;; *) echo "Unexpected social preview content type: $social_preview_type"; exit 1;; esac
          case "$hero_image_type" in image/jpeg*) ;; *) echo "Unexpected hero image content type: $hero_image_type"; exit 1;; esac
          case "$hero_anchor_type" in image/jpeg*) ;; *) echo "Unexpected Hero anchor content type: $hero_anchor_type"; exit 1;; esac
          case "$hero_dinner_type" in image/jpeg*) ;; *) echo "Unexpected Hero dinner content type: $hero_dinner_type"; exit 1;; esac
          case "$hero_gathering_type" in image/jpeg*) ;; *) echo "Unexpected Hero gathering content type: $hero_gathering_type"; exit 1;; esac
          case "$hero_citymeter_type" in image/jpeg*) ;; *) echo "Unexpected Hero CityMETER content type: $hero_citymeter_type"; exit 1;; esac
          case "$hero_motif_type" in image/png*) ;; *) echo "Unexpected hero motif content type: $hero_motif_type"; exit 1;; esac
          case "$robots_type" in text/plain*) ;; *) echo "Unexpected robots content type: $robots_type"; exit 1;; esac
          case "$sitemap_type" in application/xml*|text/xml*) ;; *) echo "Unexpected sitemap content type: $sitemap_type"; exit 1;; esac
          case "$llms_type" in text/plain*) ;; *) echo "Unexpected llms.txt content type: $llms_type"; exit 1;; esac
          case "$favicon_type" in image/png*) ;; *) echo "Unexpected favicon content type: $favicon_type"; exit 1;; esac
          node --input-type=module -e '
            import { createHash } from "node:crypto";
            import { readFileSync } from "node:fs";
            const html = readFileSync("/tmp/landom-index.html", "utf8");
            const english = readFileSync("/tmp/landom-en.html", "utf8");
            const app = readFileSync("/tmp/landom-app.js", "utf8");
            const navigation = readFileSync("/tmp/landom-navigation.js", "utf8");
            const approachMotion = readFileSync("/tmp/landom-approach-motion.js", "utf8");
            const brandMotion = readFileSync("/tmp/landom-brand-motion.js", "utf8");
            const mediaParallax = readFileSync("/tmp/landom-media-parallax.js", "utf8");
            const styles = readFileSync("/tmp/landom-styles.css", "utf8");
            const data = JSON.parse(readFileSync("/tmp/landom-site-data.json", "utf8"));
            const manifest = JSON.parse(readFileSync("/tmp/landom-build-manifest.json", "utf8"));
            if (!html.includes("id=\"people-board\"")) throw Error("people board missing from deployed HTML");
            for (const localizedHtml of [html, english]) {
              for (const marker of ["data-navigation-header", "id=\"menu-toggle\"", "id=\"site-menu\"", "id=\"join-team-link\""]) {
                if (!localizedHtml.includes(marker)) throw Error(`unified navigation marker missing from deployed HTML: ${marker}`);
              }
              if (localizedHtml.includes("href=\"#certificates\"")) throw Error("deployed navigation links to a page section that does not exist");
              if (!/data-ds-version="0\.9\.1"/.test(localizedHtml)) throw Error("deployed HTML is not bound to DS v0.9.1");
              if (!localizedHtml.includes("public/assets/design-system/color-srgb-05.production.css") || !localizedHtml.includes("public/assets/landometer/landometer-motifs.css") || !localizedHtml.includes("public/assets/landometer/landometer-motifs.js")) throw Error("deployed HTML is missing local governed DS/motif assets");
            }
            const header = html.match(/<header\b[\s\S]*?<\/header>/)?.[0] || "";
            if ((header.match(/<(?:a|button)\b/g) || []).length > 4) throw Error("deployed desktop navbar exceeds the four-control DS budget");
            const brand = header.match(/<a\b[^>]*class="[^"]*\bbrand\b[^"]*"[^>]*>[\s\S]*?<\/a>/)?.[0] || "";
            if (!brand.includes("<img") || brand.includes("<lm-motif")) throw Error("deployed navbar logo is not the approved static identity");
            for (const selector of ["brand", "header-link", "header-cta"]) {
              if (!new RegExp(`\\.${selector}[^{}]*\\{(?=[^}]*min-height:\\s*44px;)[^}]*\\}`, "s").test(styles)) throw Error(`deployed .${selector} does not retain a direct 44px semantic target`);
            }
            if (!/\.menu-toggle\s*\{(?=[^}]*width:\s*44px;)(?=[^}]*height:\s*44px;)[^}]*\}/s.test(styles)) throw Error("deployed menu toggle is not a direct 44 by 44px target");
            if ((html.match(/\bdata-motion-toggle\b/g) || []).length !== 1 || !html.includes("id=\"motion-toggle\"")) throw Error("deployed page-level motion pause control is missing or duplicated");
            if ((html.match(/\bdata-cta-discovery\b/g) || []).length !== 2) throw Error("deployed CTAs are missing the finite discovery markers");
            if ((html.match(/data-parallax-authority="owner-approved-site-override"/g) || []).length !== 1) throw Error("deployed bounded parallax is missing its explicit owner-approved authority marker");
            const motifSources = `${html}\n${app}`;
            const motifFallbacks = [
              ["logo", true, "logo-quiet.svg"], ["dial", true, "dial-quiet.svg"], ["rings", true, "rings-quiet.svg"],
              ["layers", true, "layers-quiet.svg"], ["slice", true, "slice-quiet.svg"], ["cultivate", true, "cultivate-quiet.svg"]
            ];
            const motifMarkup = [...motifSources.matchAll(/<lm-motif\b([^>]*)>([\s\S]*?)<\/lm-motif>/g)];
            if (motifMarkup.length !== motifFallbacks.length) throw Error("deployed page does not expose exactly six governed motif fallbacks");
            for (const [kind, quiet, file] of motifFallbacks) {
              const matches = motifMarkup.filter(([, attributes, body]) => new RegExp(`\\bkind=["\x27]${kind}["\x27]`).test(attributes) && /(?:^|\s)quiet(?:\s|=|$)/.test(attributes) === quiet && !/(?:^|\s)ink=["\x27]/.test(attributes) && body.includes(`./public/assets/landometer/svg/${file}`));
              if (matches.length !== 1) throw Error(`deployed ${kind} motif is missing its exact ${file} fallback`);
            }
            const thaiMenuPeopleLinks = html.match(/<a\b(?=[^>]*\bdata-menu-close\b)(?=[^>]*href="#people")[^>]*>/g) || [];
            const englishMenuPeopleLinks = english.match(/<a\b(?=[^>]*\bdata-menu-close\b)(?=[^>]*href="https:\/\/montri-th\.github\.io\/Landom\/en\/#people")[^>]*>/g) || [];
            if (thaiMenuPeopleLinks.length !== 1) throw Error("Thai compact-menu people shortcut is missing or duplicated");
            if (englishMenuPeopleLinks.length !== 1) throw Error("English compact-menu people shortcut is missing, duplicated, or leaves the localized route");
            for (const localizedHtml of [html, english]) {
              if (localizedHtml.includes("bookmark-rail") || localizedHtml.includes("data-scrollspy-link")) throw Error("obsolete bookmark rail remains in deployed HTML");
            }
            if (!/id="language-toggle"[\s\S]*?href="\.\/en\/"[\s\S]*?hreflang="en"/.test(html) || !/id="language-toggle"[\s\S]*?href="https:\/\/montri-th\.github\.io\/Landom\/"[\s\S]*?hreflang="th"/.test(english)) throw Error("localized language routes are missing from the deployed menu");
            if (!app.includes("./navigation.js") || !app.includes("./approach-motion.js") || !app.includes("./brand-motion.js") || !app.includes("./media-parallax.js")) throw Error("navigation, approach-motion, brand-motion, or media-parallax module is not imported by deployed app.js");
            if (!navigation.includes("aria-expanded") || !navigation.includes("prefers-reduced-motion: reduce") || !navigation.includes("Escape")) throw Error("deployed navigation module is missing required accessible-state guards");
            for (const token of ["threshold: 0.14", "rootMargin: \"0px 0px -12% 0px\"", "INIT_WATCHDOG_MS = 2400", "STAGGER_STEP_MS = 150", "STAGGER_CAP_MS = 450", "TRANSFORM_SETTLE_MS = 920"]) {
              if (!approachMotion.includes(token)) throw Error(`deployed approach-motion module is missing exact v0.9.1 token: ${token}`);
            }
            if ((approachMotion.match(/new\s+win\.IntersectionObserver\b/g) || []).length !== 1 || !approachMotion.includes("observer?.unobserve(target)")) throw Error("deployed approach motion is not once-only through one shared observer");
            if (app.includes("shell.dataset.approach =")) throw Error("deployed directory blanket-arms every card for reveal motion");
            for (const token of ["--leading-display-th: 1.25", "--motion-duration-reveal-opacity: 760ms", "--motion-duration-reveal-transform: 920ms", "--motion-duration-media-arrival: 900ms", "--motion-delay-stagger: 150ms", "--motion-delay-stagger-cap: 450ms", "--motion-distance-reveal: 32px", "--motion-distance-reveal-pair: 36px", "--motion-scale-reveal: 0.985"]) {
              if (!styles.includes(token)) throw Error(`deployed styles are missing exact v0.9.1 token: ${token}`);
            }
            if (!/opacity var\(--motion-duration-reveal-opacity\) var\(--motion-ease-enter\)/.test(styles) || !/transform var\(--motion-duration-reveal-transform\) var\(--motion-ease-settle\)/.test(styles) || !/scale\(var\(--motion-scale-reveal\)\)/.test(styles)) throw Error("deployed reveal CSS does not consume the exact v0.9.1 timing and scale recipe");
            const ctaSweepRule = styles.match(/\.header-cta-sweep\s*\{[^}]*\}/s)?.[0] || "";
            const ctaActiveRule = styles.match(/\.header-cta\.is-cta-cue-active \.header-cta-sweep\s*\{[^}]*\}/s)?.[0] || "";
            const ctaCueRules = `${ctaSweepRule}\n${ctaActiveRule}`;
            if (!ctaCueRules.includes("540ms") || !/36%\s+64%/.test(ctaSweepRule) || !/opacity:\s*1;/.test(ctaSweepRule) || /\binfinite\b/.test(ctaCueRules) || /@keyframes\s+lmFlick\b/.test(styles) || !/@keyframes\s+lmCtaDiscovery[\s\S]*?-120%[\s\S]*?120%/.test(styles)) throw Error("deployed CTA discovery cue is not the once-only 540ms 28% sweep");
            if (!brandMotion.includes("const CUE_DURATION_MS = 540") || !brandMotion.includes("cuePlayed = true") || !brandMotion.includes("ctas.find((cta) => isVisible(cta, win))") || !brandMotion.includes("dataset.motionPaused")) throw Error("deployed brand-motion owner does not provide once-only visible CTA cue and pause state");
            if (!mediaParallax.includes("data-parallax-media")) throw Error("deployed media-parallax module is missing the explicit media marker contract");
            for (const asset of ["landom-community-anchor.jpg", "landom-community-dinner.jpg", "landom-community-gathering.jpg", "landom-community-citymeter.jpg"]) {
